---
name: Type Check

on:
  push:
    branches:
      - main
      - test
    paths-ignore:
      - "**/README.md"

jobs:
  ty:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        run: uv sync --no-group test --no-group lint

      - name: Check types with ty
        run: uv run ty check
